<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/tab.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Browse and search the main cast of Breaking Bad: characters, the actors who play them and their birthdays.">
    <title>Breaking Bad Characters</title>
</head>

<body>
    <div class="container">
        <header class="text-center mt-5">
            <img src="img/bb-logo.png" alt="Breaking Bad">
            <div class="mt-3">
                <button type="button" id="music-toggle" class="btn btn-sm btn-outline-light" aria-pressed="false">Play theme music</button>
            </div>
        </header>
        <div class="row mt-4">
            <div class="col-md-6 mx-auto">
                <label for="inp-search" class="visually-hidden">Search characters by character or actor name</label>
                <input type="search" id="inp-search" class="form-control" placeholder="Search Characters..." autocomplete="off">
            </div>
        </div>

        <section class="mt-5">
            <div class="row" id="output">

            </div>
        </section>

        <footer class="text-center text-white-50 small my-4">
            Cast data from <a class="text-white" href="https://www.tvmaze.com/shows/169/breaking-bad">TVmaze</a>,
            used under the <a class="text-white" href="https://www.tvmaze.com/api">TVmaze API</a> CC BY-SA license.
        </footer>
    </div>
    <script src="main.js"></script>
</body>

</html>
